<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2f6fed"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>GTD Dashboard</title></head><body>
<div class="stick"><div class="wrap"><div class="bar" id="bar"></div></div></div>
<main class="wrap">
<div id="overdue"></div>
<div class="bar" id="tabs"></div>
<div id="manage"></div>
<div id="list"></div>
<div id="upcoming"></div>
<div id="hint"></div>
<div class="foot mut" id="status"></div>
</main>
<dialog id="tabdlg"><h3 id="tdt">New tab</h3>
<label class="f">Name<input id="tn" placeholder="e.g. Next 2 weeks"></label>
<label class="f">Rule<select id="tr">
<option value="exact">Due in exactly N days</option><option value="within">Due within the next N days</option>
<option value="between">Due between day X and day Y from today</option><option value="month">Due this month</option>
<option value="week">Due this week</option><option value="none">No deadline (Someday / whenever)</option><option value="overdue">Overdue</option></select></label>
<div class="row"><label class="f" id="la">N<input id="ta" type="number" min="0"></label><label class="f" id="lb">Y<input id="tb" type="number" min="0"></label></div>
<div class="row"><button class="btn" id="tsave">Save</button><button class="btn g" id="tcancel">Cancel</button></div></dialog>
<dialog id="setdlg"><h3>Settings</h3>
<label class="f">Week ends on<select id="sw"><option value="0">Sunday</option><option value="6">Saturday</option></select></label>
<div class="mut" style="margin-top:12px">GitHub sync (optional, see README)</div>
<label class="f">Repository (owner/name)<input id="sr" placeholder="you/gtd-dashboard" autocapitalize="off"></label>
<label class="f">Branch<input id="sb" placeholder="main" autocapitalize="off"></label>
<label class="f">Data file path<input id="sp" placeholder="data/gtd.json" autocapitalize="off"></label>
<label class="f">Access token<input id="st" type="password" autocomplete="off"></label>
<div class="mut" id="sstat" style="margin-top:8px"></div>
<div class="row"><button class="btn" id="ssave">Save &amp; sync</button><button class="btn g" id="sclose">Close</button></div></dialog>
<script src="core.js"></script>
<script>
const $=id=>document.getElementById(id);
let cur=null,manage=false,editing=null;
const tabs=()=>G.list('tabs').sort((a,b)=>a.order-b.order);
function render(){
 $('bar').innerHTML=G.catBar('dash');
 const T=tabs();if(!T.find(t=>t.id===cur))cur=T[0]?T[0].id:null;
 const open=G.open(),od=open.filter(t=>t.dl&&G.diff(t.dl)<0).sort(G.byDue);
 $('overdue').innerHTML=od.length?'<div class="card od"><h3 class="red">Overdue · '+od.length+' task'+(od.length>1?'s':'')+'</h3>'+od.map(t=>G.taskRow(t,{cat:1})).join('')+'</div>':'';
 $('tabs').innerHTML=T.map(b=>'<button class="pill'+(b.id===cur?' on':'')+'" data-act="tab" data-id="'+b.id+'">'+G.esc(b.name)+'<span class="badge">'+open.filter(t=>G.match(t,b)).length+'</span></button>').join('')+
  '<button class="pill" data-act="newtab" aria-label="Add tab">+</button><button class="pill" data-act="manage">'+(manage?'Done':'Edit tabs')+'</button><button class="pill" data-act="settings" aria-label="Settings">⚙</button>';
 $('manage').innerHTML=manage?'<div class="card">'+T.map(b=>'<div class="hd"><span>'+G.esc(b.name)+'</span><span><button class="s" data-act="tl" data-id="'+b.id+'">‹</button><button class="s" data-act="tr" data-id="'+b.id+'">›</button><button class="s" data-act="etab" data-id="'+b.id+'">✎</button><button class="s" data-act="dtab" data-id="'+b.id+'">✕</button></span></div>').join('')+'</div>':'';
 const b=T.find(x=>x.id===cur);
 if(b){const ts=open.filter(t=>G.match(t,b)).sort(G.byDue),tot=ts.reduce((a,t)=>a+(t.min||0),0);
  $('list').innerHTML='<div class="card"><div class="mut" style="margin-bottom:4px">'+ts.length+' task'+(ts.length===1?'':'s')+(tot?' · '+G.fmt(tot):'')+'</div>'+(ts.map(t=>G.taskRow(t,{cat:1})).join('')||'<div class="mut">Nothing here ✓</div>')+'</div>'}else $('list').innerHTML='';
 const up=open.filter(t=>t.dl&&G.diff(t.dl)>=0).sort(G.byDue);
 $('upcoming').innerHTML='<div class="card"><h3>Upcoming · '+up.length+' task'+(up.length===1?'':'s')+'</h3>'+(up.map(t=>G.taskRow(t,{cat:1})).join('')||'<div class="mut">No upcoming deadlines ✓</div>')+'</div>';
 $('hint').innerHTML=G.list('cats').length?'':'<div class="card mut">Create your first category with “+ New category” above to get started.</div>';
 $('status').textContent=G.status;$('sstat').textContent=G.status;
}
function move(id,d){const T=tabs(),i=T.findIndex(t=>t.id===id),j=i+d;if(j<0||j>=T.length)return;[T[i],T[j]]=[T[j],T[i]];T.forEach((t,k)=>{if(t.order!==k){t.order=k;G.put('tabs',t)}})}
function ruleUI(){const r=$('tr').value;$('la').style.display=(r==='exact'||r==='within'||r==='between')?'':'none';$('lb').style.display=r==='between'?'':'none';$('la').firstChild.textContent=r==='between'?'From day X':'N days'}
function openTab(id){editing=id||null;const b=id?G.get('tabs',id):{name:'',rule:'exact',a:'',b:''};$('tdt').textContent=id?'Edit tab':'New tab';$('tn').value=b.name;$('tr').value=b.rule;$('ta').value=b.a;$('tb').value=b.b;ruleUI();$('tabdlg').showModal()}
$('tr').onchange=ruleUI;
$('tcancel').onclick=()=>$('tabdlg').close();
$('tsave').onclick=()=>{const n=$('tn').value.trim();if(!n){$('tn').focus();return}
 const base=editing?Object.assign({},G.get('tabs',editing)):{order:tabs().length};
 const o=G.put('tabs',Object.assign(base,{name:n,rule:$('tr').value,a:+$('ta').value||0,b:+$('tb').value||0}));cur=o.id;$('tabdlg').close()};
function openSet(){const c=G.cfg();$('sw').value=String(c.weekEnd||0);$('sr').value=c.repo||'';$('sb').value=c.branch||'';$('sp').value=c.path||'';$('st').value=c.token||'';$('setdlg').showModal()}
$('sclose').onclick=()=>$('setdlg').close();
$('ssave').onclick=()=>{G.setCfg({weekEnd:+$('sw').value,repo:$('sr').value.trim(),branch:$('sb').value.trim(),path:$('sp').value.trim(),token:$('st').value.trim()});render();G.sync()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(a==='tab')cur=id;else if(a==='manage')manage=!manage;else if(a==='newtab')openTab();else if(a==='etab')openTab(id);
 else if(a==='dtab'){if(confirm('Delete this tab?'))G.del('tabs',id)}else if(a==='tl')move(id,-1);else if(a==='tr')move(id,1);else if(a==='settings')openSet();
 render()});
G.onChange(render);
G.init().then(render);
</script></body></html>
