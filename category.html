<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2f6fed"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Category · GTD</title></head><body>
<div class="stick"><div class="wrap"><div class="bar" id="bar"></div></div></div>
<main class="wrap">
<div id="missing" class="card" hidden>Category not found. <a href="index.html">Back to dashboard</a></div>
<div id="main" hidden>
<div class="hd"><h1 id="head"></h1><span><button class="s" id="ren">Rename</button><button class="s red" id="delcat">Delete</button></span></div>
<h2>Tasks</h2><div class="mut" id="summary"></div>
<div class="card">
<div class="row"><input id="fn" placeholder="Task name" style="flex:2 1 220px"><input id="fm" placeholder="Time needed (e.g. 1h 30m)"></div>
<div class="row"><input id="fd" type="date"><label class="mut" style="display:flex;align-items:center;gap:6px;flex:0 0 auto"><input type="checkbox" id="fx" style="width:20px;height:20px"> No deadline</label></div>
<div class="row"><input id="fo" placeholder="Notes (optional)"></div>
<div class="row"><button class="btn" id="fsave">Add task</button><button class="btn g" id="fcancel" hidden>Cancel</button></div></div>
<div class="card" id="tlist"></div>
<div class="card" id="done" hidden></div>
<h2>Remember</h2>
<div class="card"><ol id="rlist"></ol><div class="row"><input id="rn" placeholder="Something to keep in mind…" style="flex:2 1 200px"><button class="btn" id="radd">Add</button></div></div>
</div>
<div class="foot mut" id="status"></div>
</main>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
const $=id=>document.getElementById(id),cid=new URLSearchParams(location.search).get('c');
let editT=null,editR=null,showDone=false;
const rems=()=>G.list('rems').filter(r=>r.cat===cid).sort((a,b)=>a.order-b.order);
function render(){
 $('bar').innerHTML=G.catBar(cid);$('status').textContent=G.status;
 const c=G.get('cats',cid);$('missing').hidden=!!c;$('main').hidden=!c;if(!c)return;
 document.title=c.name+' · GTD';
 $('head').innerHTML='<span class="dot" style="background:'+c.color+'"></span>'+G.esc(c.name);
 const all=G.list('tasks').filter(t=>t.cat===cid),o=all.filter(t=>!t.done).sort(G.byDue),dn=all.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 const od=o.filter(t=>t.dl&&G.diff(t.dl)<0).length,tot=o.reduce((a,t)=>a+(t.min||0),0);
 $('summary').textContent=o.length+' open · '+od+' overdue · '+(G.fmt(tot)||'0m')+' still needed';
 const dated=o.filter(t=>t.dl),nod=o.filter(t=>!t.dl);
 $('tlist').innerHTML=(dated.map(t=>G.taskRow(t,{actions:1})).join('')+(nod.length?'<div class="mut grp">No deadline</div>'+nod.map(t=>G.taskRow(t,{actions:1})).join(''):''))||'<div class="mut">No open tasks.</div>';
 $('done').hidden=!dn.length;
 $('done').innerHTML=dn.length?'<div class="hd"><button class="s" id="tgl">'+(showDone?'▾':'▸')+' Completed ('+dn.length+')</button><button class="s" id="clr">Clear all</button></div>'+(showDone?dn.map(t=>G.taskRow(t,{actions:1})).join(''):''):'';
 $('rlist').innerHTML=rems().map((r,i)=>'<li>'+(editR===r.id?'<input id="re" value="'+G.esc(r.text)+'" style="width:80%"> <button class="s" data-rs="'+r.id+'">Save</button>':G.esc(r.text)+' <button class="s" data-re="'+r.id+'">✎</button><button class="s" data-ru="'+r.id+'">↑</button><button class="s" data-rd="'+r.id+'">✕</button>')+'</li>').join('')||'<div class="mut">Nothing yet.</div>';
 if(editR&&$('re'))$('re').focus();
}
function clearForm(){editT=null;['fn','fm','fd','fo'].forEach(i=>$(i).value='');$('fx').checked=false;$('fsave').textContent='Add task';$('fcancel').hidden=true}
$('fsave').onclick=()=>{const name=$('fn').value.trim();if(!name){$('fn').focus();return}
 const base=editT?Object.assign({},G.get('tasks',editT)):{cat:cid,done:false,doneAt:0};
 G.put('tasks',Object.assign(base,{name,dl:$('fx').checked?'':$('fd').value,min:G.parseMin($('fm').value),notes:$('fo').value.trim()}));clearForm()};
$('fcancel').onclick=clearForm;
$('fd').onchange=()=>{if($('fd').value)$('fx').checked=false};
$('fx').onchange=()=>{if($('fx').checked)$('fd').value=''};
$('ren').onclick=()=>{const c=G.get('cats',cid);let n=prompt('Rename category',c.name);if(n==null)return;n=n.trim();if(!n)return;
 if(G.list('cats').some(x=>x.id!==cid&&x.name.toLowerCase()===n.toLowerCase())){alert('A category with that name already exists.');return}
 G.put('cats',Object.assign({},c,{name:n}))};
$('delcat').onclick=()=>{const n=G.list('tasks').filter(t=>t.cat===cid).length+rems().length;
 if(confirm('Delete this category? Its '+n+' task(s) and note(s) will be deleted too. This cannot be undone.')){G.delCategory(cid);location.href='index.html'}};
function addRem(){const v=$('rn').value.trim();if(!v)return;const m=rems().reduce((a,r)=>Math.max(a,r.order),0);G.put('rems',{cat:cid,text:v,order:m+1});$('rn').value=''}
$('radd').onclick=addRem;
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'){if(e.target.id==='rn')addRem();else if(e.target.id==='re'){const r=G.get('rems',editR);G.put('rems',Object.assign({},r,{text:e.target.value.trim()||r.text}));editR=null}else if(['fn','fm','fo'].includes(e.target.id))$('fsave').click()}
 if(e.key==='Escape'&&editR){editR=null;render()}});
document.addEventListener('click',e=>{const d=e.target.dataset||{};
 if(d.edit){const t=G.get('tasks',d.edit);editT=t.id;$('fn').value=t.name;$('fm').value=G.fmt(t.min);$('fd').value=t.dl||'';$('fx').checked=!t.dl;$('fo').value=t.notes||'';$('fsave').textContent='Save task';$('fcancel').hidden=false;$('fn').focus();scrollTo({top:0,behavior:'smooth'})}
 else if(d.del){if(confirm('Delete this task?'))G.del('tasks',d.del)}
 else if(e.target.id==='tgl'){showDone=!showDone;render()}
 else if(e.target.id==='clr'){if(confirm('Permanently clear completed tasks?'))G.list('tasks').filter(t=>t.cat===cid&&t.done).forEach(t=>G.del('tasks',t.id))}
 else if(d.re){editR=d.re;render()}
 else if(d.rs){const r=G.get('rems',d.rs);G.put('rems',Object.assign({},r,{text:$('re').value.trim()||r.text}));editR=null}
 else if(d.rd)G.del('rems',d.rd);
 else if(d.ru){const L=rems(),i=L.findIndex(r=>r.id===d.ru);if(i>0){const a=L[i],b=L[i-1],t=a.order;G.put('rems',Object.assign({},a,{order:b.order}));G.put('rems',Object.assign({},b,{order:t}))}}});
G.onChange(render);
G.init().then(render);
</script></body></html>
